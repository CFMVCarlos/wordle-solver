[project]
name = "wordle-solver"
version = "1.0.0"
description = "High-performance Wordle Solver and interactive desktop assistant with information-theoretic heuristics."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Carlos Valente", email = "cfmvcarlos@gmail.com" }]
license = { text = "MIT" }
keywords = ["wordle", "wordle-solver", "python", "tkinter", "algorithm", "heuristic", "desktop-app"]
classifiers = [
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Puzzle Games",
]
dependencies = [
    "pillow>=12.3.0",
]

[project.urls]
Homepage = "https://github.com/CFMVCarlos/wordle-solver"
Repository = "https://github.com/CFMVCarlos/wordle-solver.git"
Issues = "https://github.com/CFMVCarlos/wordle-solver/issues"

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pydoclint>=0.6.0",
    "basedpyright>=1.28.0",
    "pytest>=8.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pydoclint]
style = "numpy"
exclude = '\.venv|\.agents|__pycache__|build|dist'
check-return-types = true
check-arg-defaults = false
check-class-attributes = false



[tool.basedpyright]
typeCheckingMode = "standard"
exclude = [".venv", ".agents", "build", "dist", "__pycache__"]
pythonVersion = "3.10"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]

